rubrics:
  - id: 1
    type: f2p
    text: 每个任务的双向媒体迁移拥有持久且可恢复的方向、文件集合和阶段，重复或相反命令不会同时推进两个结果。
  - id: 2
    type: f2p
    text: 迁移到 backing cloud storage 时先完整上传并校验全部目标对象，再切换读取位置，部分上传失败不会让任务指向半套云端媒体。
  - id: 3
    type: f2p
    text: 迁移回本地时先完整下载并校验全部目标文件，再切换读取位置，部分下载失败不会覆盖或发布不完整的本地媒体。
  - id: 4
    type: f2p
    text: 数据库位置切换后源文件清理中断或进程退出时，后续运行能从待清理阶段续做且不会删除当前唯一有效副本。
  - id: 5
    type: f2p
    text: 同一任务的重复、反向或并发迁移命令会稳定返回已完成、继续恢复或冲突结果，最终只保留一个可读取的权威位置。
  - id: 6
    type: f2p
    text: 批量迁移按任务隔离状态和恢复动作，一个任务的复制或清理失败不会提交、回滚或误报其他任务的结果。
  - id: 7
    type: p2p
    text: 成功迁移的图片和受支持视频、默认 backing storage、既有无操作提示、备份、删除及正常 frame 和 chunk 读取行为保持兼容。
